  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700&display=swap');

    * { box-sizing: border-box; }

    body {
      font-family: 'Noto Serif', serif;
      max-width: 800px;
      margin: 0 auto;
      background: #f5e6b8;
      color: #2c1a0e;
    }

    .banner {
      position: relative;
      height: 200px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.35);
      margin: 1.25rem 1.5rem 0;
      border-radius: 2px;
    }

    .banner-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .banner-content {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
    }

    .banner h1 {
      color: #f5d98a;
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-shadow: 0 2px 14px rgba(0,0,0,0.6), 0 0 40px rgba(201,168,76,0.25);
      margin: 0;
    }

    .banner-ornament {
      color: rgba(201,168,76,0.75);
      font-size: 0.8rem;
      letter-spacing: 0.5em;
    }

    .content {
      padding: 1.25rem 1.5rem 2rem;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 1rem;
      color: #8b0000;
      text-decoration: none;
      font-size: 0.85rem;
      letter-spacing: 0.05em;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    .block {
      background: #fff8f0;
      border-radius: 2px;
      padding: 0.5rem 0.75rem;
      margin-bottom: 0.55rem;
      border: 1px solid rgba(160,110,20,0.22);
      border-left: 4px solid #c9a84c;
      box-shadow: 0 1px 5px rgba(100,0,0,0.08);
    }

    .title {
      font-size: 0.75rem;
      font-weight: 700;
      color: #8b0000;
      margin-bottom: 0.25rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    audio {
      width: 100%;
      display: block;
    }

    @media (max-width: 480px) {
      .banner {
        margin: 0.75rem 0.75rem 0;
        height: 150px;
      }
      .banner h1 {
        font-size: 1.15rem;
        letter-spacing: 0.06em;
      }
      .banner-ornament {
        letter-spacing: 0.2em;
        font-size: 0.7rem;
      }
      .content {
        padding: 0.75rem 0.75rem 1.5rem;
      }
    }
  </style>
</head>
